# Stack for the MotionEye Proxy Gallery.
# Secrets/paths come from the environment (Portainer stack Env array, or a local
# --env-file deploy.local.env). Nothing sensitive is committed here.
services:
  gallery:
    build:
      context: .
      dockerfile: Dockerfile
    image: motioneye-proxy-gallery:latest
    container_name: motioneye-proxy-gallery
    ports:
      - "${GALLERY_PORT:-8762}:8762"
    environment:
      PORT: "8762"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      MOTIONEYE_URL: "${MOTIONEYE_URL}"
      MOTIONEYE_USER: "${MOTIONEYE_USER}"
      MOTIONEYE_PASSWORD: "${MOTIONEYE_PASSWORD}"
      SECRET_KEY: "${SECRET_KEY}"
      KUKLE_POWER_LOGIN_URL: "${KUKLE_POWER_LOGIN_URL:-/}"
      DATABASE_URL: "file:/config/gallery.db"
      CONFIG_DIR: "/config"
      MEDIA_ROOT: "/media"
      REMOTE_CONCURRENCY: "${REMOTE_CONCURRENCY:-1}"
      INDEX_EMPTY_DAY_LIMIT: "${INDEX_EMPTY_DAY_LIMIT:-30}"
      # Periodic cycles re-scan only the last N days (cheap; always catches the new day).
      INDEX_RECENT_DAYS: "${INDEX_RECENT_DAYS:-3}"
      # Background activity detection (local-only frame-differencing; no remote/GSM fetch).
      ACTIVITY_DETECTION_ENABLED: "${ACTIVITY_DETECTION_ENABLED:-true}"
      ACTIVITY_SCAN_INTERVAL_SECONDS: "${ACTIVITY_SCAN_INTERVAL_SECONDS:-120}"
      ACTIVITY_SCAN_BATCH: "${ACTIVITY_SCAN_BATCH:-500}"
      # Sensitivity: fraction of frame changed to flag (higher = less sensitive); per-pixel
      # delta; and the color/grayscale boundary used to ignore day<->night IR switches.
      ACTIVITY_SCORE_THRESHOLD: "${ACTIVITY_SCORE_THRESHOLD:-0.04}"
      ACTIVITY_PIXEL_THRESHOLD: "${ACTIVITY_PIXEL_THRESHOLD:-25}"
      ACTIVITY_COLOR_THRESHOLD: "${ACTIVITY_COLOR_THRESHOLD:-8}"
      # Extended pass: semantic labels from a vision model in LM Studio on the workstation.
      # Optional and OFF by default — the gallery is fully usable without it. When on, it
      # probes every AI_PROBE_INTERVAL_SECONDS whether the model is loaded, and only then
      # scans. All traffic is LAN; the GSM link is never touched.
      AI_TAGGING_ENABLED: "${AI_TAGGING_ENABLED:-false}"
      AI_LMSTUDIO_URL: "${AI_LMSTUDIO_URL:-http://192.168.0.11:1234}"
      AI_MODEL: "${AI_MODEL:-qwen/qwen3-vl-8b}"
      AI_PROBE_INTERVAL_SECONDS: "${AI_PROBE_INTERVAL_SECONDS:-300}"
      AI_IMAGE_WIDTH: "${AI_IMAGE_WIDTH:-1024}"
      AI_PROMPT_VERSION: "${AI_PROMPT_VERSION:-semantics-v1}"
      AI_WEATHER_PROMPT_VERSION: "${AI_WEATHER_PROMPT_VERSION:-weather-v1}"
      AI_WEATHER_MIN_GAP_SECONDS: "${AI_WEATHER_MIN_GAP_SECONDS:-600}"
      AI_BATCH: "${AI_BATCH:-200}"
      AI_REQUEST_TIMEOUT_MS: "${AI_REQUEST_TIMEOUT_MS:-60000}"
      AI_MAX_FAILURES: "${AI_MAX_FAILURES:-5}"
    volumes:
      # App data (sqlite, logs, thumbnails). Owned by the app.
      - "${CONFIG_DIR:-./data}:/config"
      # Media archive. Existing files are never modified; only new files are written.
      # Set MEDIA_RO_SUFFIX=":ro" to mount read-only (guarantees the archive is untouched).
      - "${MEDIA_ROOT:-./media}:/media${MEDIA_RO_SUFFIX:-}"
    restart: unless-stopped
    extra_hosts:
      - "host-gateway:host-gateway"
    # Cap container stdout/stderr logs so they cannot fill the host root filesystem
    # (Docker json-file logs live under /var/lib/docker on the NAS root disk).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
